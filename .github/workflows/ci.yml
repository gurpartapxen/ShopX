name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: lint + security scan ──────────────────────────────────────────
  backend-checks:
    name: Backend — Lint & Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production + dev dependencies
        run: |
          pip install -r backend/requirements_clean.txt \
                      -r backend/requirements-dev.txt

      - name: Lint with flake8
        run: flake8 backend/ --config backend/.flake8

      - name: Security scan with bandit
        run: |
          bandit -r backend/ \
            --exclude backend/venv,backend/.venv \
            --severity-level medium \
            --quiet

  # ── Frontend: lint + build ──────────────────────────────────────────────────
  frontend-checks:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint with ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build check
        working-directory: frontend
        env:
          # Placeholder URL — build doesn't make real API calls
          NEXT_PUBLIC_API_URL: https://placeholder.example.com/api
        run: npm run build

  # ── Deploy backend to Render (only after both jobs pass, only on main) ──────
  deploy-backend:
    name: Deploy Backend → Render
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl --silent --show-error --fail -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "✅ Render deploy triggered"
          else
            echo "ℹ️  RENDER_DEPLOY_HOOK_URL secret not set — skipping deploy trigger."
            echo "   To enable: Render Dashboard → Service → Settings → Deploy Hook"
            echo "   Then add it as a GitHub secret named RENDER_DEPLOY_HOOK_URL"
          fi
